                                }
                            }

                            // Horizontal Position
                            const hPad = isHoriz ? 80 : 40;
                            hx = (item.hinge === 'left') ? w - hPad : hPad;

                            handleGrp.position.set(hx, hy, frontThick + 25);
                            frontsGroup.add(handleGrp);
                        }
                    });
                }

                modGroup.add(frontsGroup);

                // Drawer handles if drawer unit - REMOVED (Handled in Fronts logic above)


                // Plinth (Sokl)
                if (item.type !== 'wall' && item.elevation > 0) {
                    const pGeo = new THREE.BoxGeometry(w - 10, item.elevation, d - 40);
                    const pMesh = new THREE.Mesh(pGeo, plinthMat);
                    pMesh.position.set(w / 2, item.elevation / 2, (d - 40) / 2 + 20); // Recessed
                    modGroup.add(pMesh);
                }

                // Worktop with CUTOUT
                if (item.type === 'base') {
                    // Check for surface appliances
                    const surfApp = item.appliances.find(a => APPLIANCE_TYPES[a.type].isSurface);

                    if (surfApp && (surfApp.type === 'sink' || surfApp.type === 'hob')) {
                        const wtH = getWorktopThickness();
                        const wtY = item.elevation + h + wtH / 2;
                        const cx = w / 2; const cz = (d + 20) / 2 + 2; // Center of WorktopBox

                        const appW = w * 0.7; // Cutout size
                        const appD = d * 0.6;

                        // We construct 4 boxes around the cutout
                        const fullW = w; const fullD = d + 20;
                        const sideW = (fullW - appW) / 2;
                        const frontD = (fullD - appD) / 2; // approx, depending on pos

                        // Left Piece
                        const meshL = new THREE.Mesh(new THREE.BoxGeometry(sideW, wtH, fullD), worktopMat);
                        meshL.position.set(sideW / 2, wtY, cz);
                        meshL.receiveShadow = true; meshL.castShadow = true;
                        modGroup.add(meshL);
                        // Right Piece
                        const meshR = new THREE.Mesh(new THREE.BoxGeometry(fullW - sideW - appW, wtH, fullD), worktopMat); // Adjusted width for right piece
                        meshR.position.set(fullW - (fullW - sideW - appW) / 2, wtY, cz);
                        meshR.receiveShadow = true; meshR.castShadow = true;
                        modGroup.add(meshR);
                        // Front Strip
                        const meshF = new THREE.Mesh(new THREE.BoxGeometry(appW, wtH, (fullD - appD) / 2), worktopMat);
                        meshF.position.set(cx, wtY, cz + appD / 2 + (fullD - appD) / 4);
                        meshF.receiveShadow = true; meshF.castShadow = true;
                        modGroup.add(meshF);
                        // Back Strip
                        const meshB = new THREE.Mesh(new THREE.BoxGeometry(appW, wtH, (fullD - appD) / 2), worktopMat);
                        meshB.position.set(cx, wtY, cz - appD / 2 - (fullD - appD) / 4);
                        meshB.receiveShadow = true; meshB.castShadow = true;
                        modGroup.add(meshB);

                    } else {
                        // Full slab
                        const wtH = getWorktopThickness();
                        const wtGeo = new THREE.BoxGeometry(w, wtH, d + 20);
                        const wtMesh = new THREE.Mesh(wtGeo, worktopMat);
                        wtMesh.position.set(w / 2, item.elevation + h + wtH / 2, (d + 20) / 2 + 2);
                        wtMesh.castShadow = true;
                        wtMesh.receiveShadow = true;
                        modGroup.add(wtMesh);
                    }
                }

                // Appliances
                item.appliances.forEach(app => {
                    const isSurface = APPLIANCE_TYPES[app.type].isSurface;
                    const isSocket = app.type === 'socket';
                    const isHood = app.type === 'hood';

                    if (isHood) {
                        // Render Hood in 3D
                        const hoodH = app.h || 400;
                        const hoodY = item.elevation + app.pos;
                        // Visible part (assuming built-in slide out or canopy)
                        // Metal color
                        const metal = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.4, metalness: 0.6 });

                        // 1. Bottom Plate (Visible Filter) - Use LOCAL coordinates relative to modGroup
                        const plate = new THREE.Mesh(new THREE.BoxGeometry(w - 4, 40, d - 4), metal);
                        plate.position.set(w / 2, hoodY + 20, (d - 4) / 2);
                        modGroup.add(plate);

                        // 2. Motor Box (Inside cabinet)
                        const motor = new THREE.Mesh(new THREE.BoxGeometry(w - 80, hoodH - 40, d - 80), new THREE.MeshStandardMaterial({ color: 0xaaaaaa }));
                        motor.position.set(w / 2, hoodY + 40 + (hoodH - 40) / 2, d / 2);
                        modGroup.add(motor);
                    }
                    else if (isSocket) {
                        // Sockets use LOCAL coordinates
                        const count = app.count || 1;
                        // No item.x here! modGroup is already at item.x

                        for (let i = 0; i < count; i++) {
                            const sY = item.elevation + app.pos + 40; // center
                            const sX = (app.offX !== undefined ? app.offX : (w - count * 80) / 2) + i * 80 + 40;

                            // Socket Frame - High contrast
                            const sGeo = new THREE.BoxGeometry(84, 84, 6);
                            // Border black
                            const sMeshBorder = new THREE.Mesh(sGeo, new THREE.MeshBasicMaterial({ color: 0x000000 }));
                            sMeshBorder.position.set(sX, sY, -16); // On wall
                            modGroup.add(sMeshBorder);

                            // Inner White
                            const sGeoIn = new THREE.BoxGeometry(76, 76, 8);
                            const sMesh = new THREE.Mesh(sGeoIn, socketMat);
                            sMesh.position.set(sX, sY, -15);
                            modGroup.add(sMesh);

                            // Pin holes
                            const hGeo = new THREE.CylinderGeometry(3.5, 3.5, 5, 16);
                            hGeo.rotateX(Math.PI / 2);
                            const h1 = new THREE.Mesh(hGeo, new THREE.MeshBasicMaterial({ color: 0x000000 }));
                            h1.position.set(sX - 15, sY, -10);
                            modGroup.add(h1);
                            const h2 = new THREE.Mesh(hGeo, new THREE.MeshBasicMaterial({ color: 0x000000 }));
                            h2.position.set(sX + 15, sY, -10);
                            modGroup.add(h2);
                            // Pin
                            const pin = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 8, 8), new THREE.MeshStandardMaterial({ color: 0x888888 }));
                            pin.rotateX(Math.PI / 2);
                            pin.position.set(sX, sY - 15, -10);
                            modGroup.add(pin);
                        }
                        return; // Done
                    }

                    // ... Appliances logic ...
                    if (isSurface) {
                        // Sink / Hob
                        const appW = w * 0.7;
                        const appD = d * 0.6;

                        // Hob Details
                        if (app.type === 'hob') {
                            const aH = 5;
                            const aGeo = new THREE.BoxGeometry(appW, aH, appD);
                            const aMesh = new THREE.Mesh(aGeo, glassMat);
                            aMesh.position.set(w / 2, item.elevation + h + getWorktopThickness() + 2.5, d / 2 + 10);
                            modGroup.add(aMesh);

                            const zGeo = new THREE.CylinderGeometry(40, 40, 2, 32);
                            const zMesh = new THREE.Mesh(zGeo, new THREE.MeshBasicMaterial({ color: 0x333333 }));
                            zMesh.position.set(w / 2 - 50, item.elevation + h + getWorktopThickness() + 4, d / 2 + 10);
                            modGroup.add(zMesh);
                            const zMesh2 = zMesh.clone();
                            zMesh2.position.set(w / 2 + 50, item.elevation + h + getWorktopThickness() + 4, d / 2 + 10);
                            modGroup.add(zMesh2);
                        }

                        // Tap (Sink) & Hollow Sink
                        if (app.type === 'sink') {
                            const basinD = 150;
                            // Cutout area (We just build walls around it or simply a box sinking in)
                            // A simple hollow box: bottom + 4 walls
                            const sThick = 5;
                            const basinColor = 0xcccccc; // Steel or Granite
                            const sMat = new THREE.MeshStandardMaterial({ color: basinColor, roughness: 0.4, metalness: 0.6 });

                            const cx = w / 2; const cy = item.elevation + h + getWorktopThickness(); const cz = d / 2 + 10;

                            // Bottom
                            const bMesh = new THREE.Mesh(new THREE.BoxGeometry(appW, sThick, appD), sMat);
                            bMesh.position.set(cx, cy - basinD, cz);
                            modGroup.add(bMesh);
                            // Front/Back Walls
                            const wallF = new THREE.Mesh(new THREE.BoxGeometry(appW, basinD, sThick), sMat);
                            wallF.position.set(cx, cy - basinD / 2, cz + appD / 2);
                            modGroup.add(wallF);
                            const wallB = new THREE.Mesh(new THREE.BoxGeometry(appW, basinD, sThick), sMat);
                            wallB.position.set(cx, cy - basinD / 2, cz - appD / 2);
                            modGroup.add(wallB);
                            // L/R Walls
                            const wallL = new THREE.Mesh(new THREE.BoxGeometry(sThick, basinD, appD), sMat);
                            wallL.position.set(cx - appW / 2, cy - basinD / 2, cz);
                            modGroup.add(wallL);
                            const wallR = new THREE.Mesh(new THREE.BoxGeometry(sThick, basinD, appD), sMat);
                            wallR.position.set(cx + appW / 2, cy - basinD / 2, cz);
                            modGroup.add(wallR);

                            // Tap
                            const tGeo = new THREE.CylinderGeometry(8, 8, 120, 16);
                            const tMesh = new THREE.Mesh(tGeo, steelMat);
                            tMesh.position.set(cx, cy + 20, cz - appD / 2 - 10);
                            modGroup.add(tMesh);
                            const tSpoutGeo = new THREE.CylinderGeometry(6, 6, 80, 16);
                            tSpoutGeo.rotateX(Math.PI / 2);
                            const tSpout = new THREE.Mesh(tSpoutGeo, steelMat);
                            tSpout.position.set(cx, cy + 80, cz - 20);
                            modGroup.add(tSpout);
                        }
                    } else {
                        // Built-in (Oven, Microwave, Fridge, etc)
                        const aH = app.h;
                        const appY_fromFloor = item.elevation + (app.pos || 0);

                        // Unit Body
                        let appColor = 0xffffff;
                        // if(app.type === 'oven') appColor = 0x111111; 

                        const aGeo = new THREE.BoxGeometry(w - 4, aH - 4, 10); // Front panel
                        let aMat = cabinetMat; // Integrated by default for fridge/dishwasher

                        if (['oven', 'microwave'].includes(app.type)) {
                            // Oven Logic
                            const ovenGrp = new THREE.Group();
                            // Frame
                            const fGeo = new THREE.BoxGeometry(w - 4, aH - 4, 5);
                            const fMesh = new THREE.Mesh(fGeo, steelMat);
                            fMesh.position.set(w / 2, appY_fromFloor + aH / 2, d + 2.5);
                            ovenGrp.add(fMesh);
                            // Glass
                            const gGeo = new THREE.BoxGeometry(w - 30, aH - 40, 5);
                            const gMesh = new THREE.Mesh(gGeo, glassMat);
                            gMesh.position.set(w / 2, appY_fromFloor + aH / 2, d + 6);
                            ovenGrp.add(gMesh);
                            // Handle
                            const hGeo = new THREE.BoxGeometry(w - 60, 10, 15);
                            const hMesh = new THREE.Mesh(hGeo, steelMat);
                            hMesh.position.set(w / 2, appY_fromFloor + aH - 40, d + 15);
                            ovenGrp.add(hMesh);

                            modGroup.add(ovenGrp);

                        } else if (app.type === 'fridge') {
                            // Fridge (Integrated usually has cabinet door)
                            const fMesh = new THREE.Mesh(new THREE.BoxGeometry(w - 2, aH - 2, 20), cabinetMat);
                            fMesh.position.set(w / 2, appY_fromFloor + aH / 2, d + 10);
                            modGroup.add(fMesh);
                            // Removed manual handle from fridge, rely on main cabinet handle
                            // If needed, we could add a small handle if hinge is 'none', but usually fridge in cabinet has door.

                        } else {
                            // Generic appliance
                        }
                    }
                });
            });

            scene.add(group);
        }

        // Helper
        function hp_base_y(h) { return h - 50; }

        window.onload = function () {
            try {
                init();
            } catch (e) {
                alert("Chyba při inicializaci: " + e.message + "\n" + e.stack);
                console.error(e);
            }
        };
        window.onresize = function () {
            try {
                draw();
            } catch (e) {
                console.error(e);
            }
        };
    </script>
</body>

</html>
